services:
  neo4j:
    image: neo4j:community
    container_name: neo4j-recomendador
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Define NEO4J_PASSWORD en el archivo .env}"
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
